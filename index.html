```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Taskora</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#f5f5ff;
      display:flex;
      min-height:100vh;
    }

    /* SIDEBAR */

    .sidebar{
      width:240px;
      background:#6C4DF6;
      color:white;
      padding:25px;
      position:fixed;
      height:100%;
    }

    .logo{
      font-size:28px;
      font-weight:bold;
      margin-bottom:40px;
    }

    .menu{
      list-style:none;
    }

    .menu li{
      padding:15px;
      margin-bottom:10px;
      border-radius:12px;
      cursor:pointer;
      transition:0.3s;
    }

    .menu li:hover{
      background:rgba(255,255,255,0.2);
    }

    /* MAIN */

    .main{
      margin-left:240px;
      padding:30px;
      width:100%;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:30px;
    }

    .topbar h1{
      color:#333;
    }

    .profile{
      width:45px;
      height:45px;
      border-radius:50%;
      background:#6C4DF6;
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:bold;
    }

    /* CARDS */

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
      gap:20px;
      margin-bottom:30px;
    }

    .card{
      background:white;
      padding:20px;
      border-radius:20px;
      box-shadow:0 4px 10px rgba(0,0,0,0.08);
    }

    .card h2{
      color:#6C4DF6;
      margin-bottom:10px;
    }

    .card p{
      font-size:28px;
      font-weight:bold;
      color:#333;
    }

    /* TASK SECTION */

    .section{
      background:white;
      padding:25px;
      border-radius:20px;
      box-shadow:0 4px 10px rgba(0,0,0,0.08);
      margin-bottom:25px;
    }

    .section-header{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:20px;
    }

    .section-header button{
      background:#6C4DF6;
      color:white;
      border:none;
      padding:10px 18px;
      border-radius:10px;
      cursor:pointer;
      font-weight:bold;
    }

    .task{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:15px;
      background:#f7f7ff;
      border-radius:12px;
      margin-bottom:12px;
    }

    .task-left{
      display:flex;
      align-items:center;
      gap:12px;
    }

    .task input{
      width:18px;
      height:18px;
    }

    .deadline{
      color:red;
      font-size:14px;
    }

    /* PROGRESS */

    .progress-container{
      margin-top:20px;
    }

    .progress-bar{
      width:100%;
      height:20px;
      background:#ddd;
      border-radius:20px;
      overflow:hidden;
    }

    .progress{
      width:67%;
      height:100%;
      background:#6C4DF6;
    }

    /* MODAL */

    .modal{
      position:fixed;
      top:0;
      left:0;
      width:100%;
      height:100%;
      background:rgba(0,0,0,0.5);
      display:none;
      justify-content:center;
      align-items:center;
    }

    .modal-content{
      background:white;
      padding:30px;
      border-radius:20px;
      width:350px;
    }

    .modal-content h2{
      margin-bottom:20px;
    }

    .modal-content input{
      width:100%;
      padding:12px;
      margin-bottom:15px;
      border:1px solid #ccc;
      border-radius:10px;
    }

    .modal-content button{
      width:100%;
      padding:12px;
      border:none;
      background:#6C4DF6;
      color:white;
      border-radius:10px;
      font-weight:bold;
      cursor:pointer;
    }

    @media(max-width:768px){

      .sidebar{
        width:80px;
        padding:20px 10px;
      }

      .logo{
        font-size:18px;
      }

      .menu li{
        font-size:12px;
        text-align:center;
      }

      .main{
        margin-left:80px;
      }

    }

  </style>
</head>

<body>

  <!-- SIDEBAR -->

  <div class="sidebar">
    <div class="logo">TASKORA</div>

    <ul class="menu">
      <li>🏠 Dashboard</li>
      <li>📅 Schedule</li>
      <li>📝 Tasks</li>
      <li>📈 Progress</li>
      <li>⚙ Settings</li>
    </ul>
  </div>

  <!-- MAIN -->

  <div class="main">

    <div class="topbar">
      <h1>Hello, Student 👋</h1>
      <div class="profile">T</div>
    </div>

    <!-- CARDS -->

    <div class="cards">

      <div class="card">
        <h2>Total Tasks</h2>
        <p id="totalTasks">3</p>
      </div>

      <div class="card">
        <h2>Completed</h2>
        <p id="completedTasks">1</p>
      </div>

      <div class="card">
        <h2>Progress</h2>
        <p>67%</p>
      </div>

    </div>

    <!-- TASKS -->

    <div class="section">

      <div class="section-header">
        <h2>Today's Tasks</h2>
        <button onclick="openModal()">+ Add Task</button>
      </div>

      <div id="taskList">

        <div class="task">
          <div class="task-left">
            <input type="checkbox" checked>
            <span>Math Homework</span>
          </div>
          <span class="deadline">Today</span>
        </div>

        <div class="task">
          <div class="task-left">
            <input type="checkbox">
            <span>Biology Assignment</span>
          </div>
          <span class="deadline">Tomorrow</span>
        </div>

        <div class="task">
          <div class="task-left">
            <input type="checkbox">
            <span>English Presentation</span>
          </div>
          <span class="deadline">Friday</span>
        </div>

      </div>

    </div>

    <!-- PROGRESS -->

    <div class="section">

      <h2>Study Progress</h2>

      <div class="progress-container">

        <div class="progress-bar">
          <div class="progress"></div>
        </div>

      </div>

    </div>

  </div>

  <!-- MODAL -->

  <div class="modal" id="modal">

    <div class="modal-content">

      <h2>Add New Task</h2>

      <input type="text" id="taskInput" placeholder="Enter task name">

      <button onclick="addTask()">Add Task</button>

    </div>

  </div>

  <script>

    const modal = document.getElementById("modal");
    const taskList = document.getElementById("taskList");

    function openModal(){
      modal.style.display = "flex";
    }

    window.onclick = function(e){
      if(e.target == modal){
        modal.style.display = "none";
      }
    }

    function addTask(){

      const taskInput = document.getElementById("taskInput");

      if(taskInput.value.trim() === ""){
        alert("Please enter a task!");
        return;
      }

      const taskDiv = document.createElement("div");
      taskDiv.classList.add("task");

      taskDiv.innerHTML = `
        <div class="task-left">
          <input type="checkbox">
          <span>${taskInput.value}</span>
        </div>
        <span class="deadline">New</span>
      `;

      taskList.appendChild(taskDiv);

      taskInput.value = "";
      modal.style.display = "none";

      updateStats();
    }

    function updateStats(){

      const tasks = document.querySelectorAll(".task");
      const checked = document.querySelectorAll(".task input:checked");

      document.getElementById("totalTasks").innerText = tasks.length;
      document.getElementById("completedTasks").innerText = checked.length;
    }

    document.addEventListener("change", updateStats);

  </script>

</body>
</html>
