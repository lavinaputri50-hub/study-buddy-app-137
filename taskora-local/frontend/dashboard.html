<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard — Taskora</title>
    <meta name="description" content="Ringkasan tugas, persentase progres, dan deadline terdekat di dashboard Taskora." />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="layout">
      <nav class="sidebar" id="sidebar"></nav>
      <div class="main">
        <header class="topbar">
          <strong>Dashboard</strong>
          <div id="topbar-user" style="display:flex;align-items:center;gap:16px"></div>
        </header>
        <main class="content">
          <h1 class="page-title" id="greeting">Halo!</h1>
          <p class="page-sub">Berikut ringkasan aktivitas belajarmu hari ini.</p>

          <div class="grid grid--3" style="margin-bottom:18px">
            <div class="card"><p class="stat__label">Total Tugas</p><p class="stat__value" id="stat-total">0</p></div>
            <div class="card"><p class="stat__label">Tugas Selesai</p><p class="stat__value" id="stat-done">0</p></div>
            <div class="card"><p class="stat__label">Progress</p><p class="stat__value" id="stat-progress">0%</p></div>
          </div>

          <div class="card" style="margin-bottom:18px">
            <p class="stat__label" style="margin-bottom:10px">Progres penyelesaian</p>
            <div class="progress-track"><div class="progress-fill" id="progress-bar" style="width:0%"></div></div>
          </div>

          <div class="card">
            <h3 style="margin-bottom:14px">Deadline Terdekat</h3>
            <div id="upcoming"></div>
          </div>
        </main>
      </div>
    </div>
    <div id="toast"></div>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
