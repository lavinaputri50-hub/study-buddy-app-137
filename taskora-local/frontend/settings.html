<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings — Taskora</title>
    <meta name="description" content="Ubah nama, email, password, foto profil, bahasa, dan mode tampilan akun Taskora." />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="layout">
      <nav class="sidebar" id="sidebar"></nav>
      <div class="main">
        <header class="topbar">
          <strong>Settings</strong>
          <div id="topbar-user" style="display:flex;align-items:center;gap:16px"></div>
        </header>
        <main class="content" style="max-width:640px">
          <h1 class="page-title">Settings</h1>
          <p class="page-sub">Kelola profil dan preferensi akunmu.</p>

          <form id="settings-form">
            <div class="card" style="margin-bottom:18px">
              <h3 style="margin-bottom:14px">Profil</h3>
              <div class="field"><label for="name">Nama</label><input id="name" name="name" required /></div>
              <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required /></div>
              <div class="field"><label for="avatar">Foto Profil (URL)</label><input id="avatar" name="avatar_url" placeholder="https://…" /></div>
              <div class="field"><label for="password">Password Baru</label><input id="password" name="password" type="password" placeholder="Kosongkan jika tidak diubah" /></div>
            </div>

            <div class="card" style="margin-bottom:18px">
              <h3 style="margin-bottom:14px">Preferensi</h3>
              <div class="field">
                <label for="language">Bahasa</label>
                <select id="language" name="language">
                  <option value="id">Bahasa Indonesia</option>
                  <option value="en">English</option>
                </select>
              </div>
              <div class="field">
                <label for="theme">Tema</label>
                <select id="theme" name="theme">
                  <option value="light">Terang</option>
                  <option value="dark">Gelap</option>
                </select>
              </div>
            </div>

            <button class="btn btn--block" type="submit">Simpan Perubahan</button>
          </form>
        </main>
      </div>
    </div>
    <div id="toast"></div>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/settings.js"></script>
  </body>
</html>
